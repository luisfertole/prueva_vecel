<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HOLA MUNDO PRUEBA VERCEL</title>
  <style>
    :root {
      --bg: #1d4ed8;
      --fg: #ffffff;
      --muted: #dbeafe;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <h1>HOLA MUNDO PRUEBA VERCEL</h1>
</body>
</html>
