<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HOLA MUNDO PRUEBA VERCEL</title>
  <style>
    :root {
      --white: #ffffff;
      --blue: #0b4fa3;
      --cyan: #00b4e6;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--white);
      color: var(--blue);
      font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "Courier New", monospace;
      overflow: hidden;
    }
    #mosaic {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    main {
      position: relative;
      z-index: 1;
      width: min(92%, 760px);
      padding: clamp(24px, 5vw, 48px);
      text-align: center;
      background: var(--white);
      border: 4px solid var(--blue);
      box-shadow: 10px 10px 0 var(--cyan);
    }
    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 6.5vw, 3.6rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
      padding: 18px 16px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--blue);
    }
  </style>
</head>
<body>
  <canvas id="mosaic" aria-hidden="true"></canvas>

  <main>
    <h1>HOLA MUNDO PRUEBA VERCEL</h1>
  </main>

  <footer>create by Luis Fernando Tolentino Segovia</footer>

  <script>
    (function () {
      var canvas = document.getElementById("mosaic");
      var ctx = canvas.getContext("2d");
      var palette = ["#0b4fa3", "#0077c8", "#00b4e6", "#1f9aa5", "#17c3b2", "#5b5fc7", "#2a4aa0", "#0a5fb4"];

      function rng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
          var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function draw() {
        var dpr = window.devicePixelRatio || 1;
        var w = window.innerWidth, h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);

        var size = w < 600 ? 14 : 20;
        var gap = 3;
        var step = size + gap;
        var cols = Math.ceil(w / step);
        var rows = Math.ceil(h / step);
        var rand = rng(2026);

        for (var r = 0; r < rows; r++) {
          var ny = (r + 0.5) * step / h;
          var d = (ny - 0.5) / 0.3;
          var base = Math.exp(-d * d * 1.2);
          if (ny > 0.9 || ny < 0.03) base = 0;
          for (var c = 0; c < cols; c++) {
            var p = base * (0.88 + 0.12 * Math.sin(c * 0.35));
            if (rand() < p) {
              ctx.fillStyle = palette[Math.floor(rand() * palette.length)];
              ctx.fillRect(c * step, r * step, size, size);
            } else {
              rand();
            }
          }
        }
      }

      draw();
      var timer;
      window.addEventListener("resize", function () {
        clearTimeout(timer);
        timer = setTimeout(draw, 120);
      });
    })();
  </script>
</body>
</html>
